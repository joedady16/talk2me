<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk2Me</title>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #fff; --text: #1f1f1f; --muted: #6b6b6b;
      --border: #e2e0db; --accent: #3b6fd8; --highlight: #fff1b8; --danger: #c8412f;
      --me: #e6eefc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --panel: #212226; --text: #e8e6e3; --muted: #9a9894;
        --border: #34353a; --accent: #7aa2f7; --highlight: #4a4320; --danger: #f07a6a;
        --me: #26324a;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 10px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 18px; margin: 0; }
    nav { display: flex; gap: 4px; }
    nav button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); }
    nav button.active { background: var(--panel); color: var(--text); outline: 1px solid var(--border); }
    #status { color: var(--muted); font-size: 14px; margin-left: auto; }
    #who { font-size: 14px; color: var(--muted); }
    button, select, input, textarea {
      font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
    }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

    /* auth */
    #auth { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px; }
    #auth h2 { margin: 0 0 4px; font-size: 20px; }
    #auth input { width: 100%; }
    #auth .error { color: var(--danger); font-size: 14px; min-height: 1.2em; }
    #auth .switch { font-size: 14px; color: var(--muted); }
    #auth .switch a { color: var(--accent); cursor: pointer; }

    main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
    aside { border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    section.view { display: flex; flex-direction: column; min-height: 0; }

    /* reader */
    #drop {
      border: 2px dashed var(--border); border-radius: 10px; padding: 22px 12px; text-align: center;
      color: var(--muted); cursor: pointer; margin-bottom: 16px; font-size: 14px;
    }
    #drop.over { border-color: var(--accent); color: var(--accent); }
    ul.list { list-style: none; padding: 0; margin: 0; }
    #docs li { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
    #docs li:hover { background: var(--panel); }
    #docs li.active { background: var(--panel); outline: 1px solid var(--border); }
    #docs .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #docs .progress { color: var(--muted); font-size: 12px; }
    #docs .delete { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 0 4px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 24px;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    #play { min-width: 90px; }
    #text { padding: 24px 32px; overflow-y: auto; max-width: 820px; }
    .empty { color: var(--muted); }
    .s { cursor: pointer; border-radius: 4px; padding: 1px 0; }
    .s:hover { text-decoration: underline dotted; }
    .s.current { background: var(--highlight); }

    /* assistant */
    #assistant-side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
    #assistant-side h3:first-child { margin-top: 0; }
    #assistant-side li { font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    #assistant-side li small { display: block; color: var(--muted); }
    #chat { flex: 1; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 640px; padding: 10px 14px; border-radius: 14px; background: var(--panel);
              border: 1px solid var(--border); white-space: pre-wrap; }
    .bubble.user { align-self: flex-end; background: var(--me); }
    .bubble.pending { color: var(--muted); font-style: italic; }
    .bubble.reminder { border-color: var(--accent); }
    #composer { display: flex; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--border); background: var(--panel); align-items: center; }
    #composer input { flex: 1; }
    #mic { width: 52px; height: 52px; border-radius: 50%; font-size: 22px; padding: 0; flex: none; }
    #mic.recording { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px transparent; } 0% { box-shadow: 0 0 0 0 var(--danger); } }

    #toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel); border: 1px solid var(--accent);
             border-radius: 12px; padding: 12px 16px; max-width: 340px; box-shadow: 0 6px 24px rgba(0,0,0,.15); }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <form id="auth" hidden>
    <h2 id="auth-title">Sign in</h2>
    <input id="auth-name" placeholder="Your name" autocomplete="name" hidden>
    <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="auth-password" type="password" placeholder="Password (10+ characters)" autocomplete="current-password" required minlength="10">
    <button class="primary" id="auth-submit">Sign in</button>
    <div class="error" id="auth-error"></div>
    <div class="switch" id="auth-switch" hidden></div>
  </form>

  <div id="app" hidden>
    <header>
      <h1>Talk2Me</h1>
      <nav>
        <button data-view="reader" class="active">Reader</button>
        <button data-view="assistant">Assistant</button>
      </nav>
      <span id="status">Loading…</span>
      <span id="who"></span>
      <button id="logout">Sign out</button>
    </header>

    <main id="reader-view">
      <aside>
        <div id="drop">Drop a document here or click to upload<br><small>PDF, Word, PowerPoint, Excel, TXT, Markdown, HTML</small></div>
        <input id="file" type="file" hidden
               accept=".pdf,.docx,.pptx,.xlsx,.txt,.md,.markdown,.html,.htm,.csv,.json,.xml">
        <ul class="list" id="docs"></ul>
      </aside>
      <section class="view">
        <div class="controls">
          <button id="prev" title="Previous sentence" disabled>⏮</button>
          <button id="play" class="primary" disabled>▶ Play</button>
          <button id="next" title="Next sentence" disabled>⏭</button>
          <label>Voice <select id="voice"></select></label>
          <label>Speed
            <select id="speed">
              <option>0.8</option><option>0.9</option><option selected>1.0</option>
              <option>1.1</option><option>1.25</option><option>1.5</option>
            </select>
          </label>
        </div>
        <div id="text"><p class="empty">Upload or select a document to start listening.</p></div>
      </section>
    </main>

    <main id="assistant-view" hidden>
      <aside id="assistant-side">
        <h3>Reminders</h3><ul class="list" id="reminders"></ul>
        <h3>Open tasks</h3><ul class="list" id="tasks"></ul>
        <h3>Recent notes</h3><ul class="list" id="notes"></ul>
      </aside>
      <section class="view">
        <div class="controls">
          <button id="new-chat">New conversation</button>
          <label><input type="checkbox" id="speak-replies" checked> Speak replies</label>
          <span class="empty" id="assistant-hint"></span>
        </div>
        <div id="chat"></div>
        <form id="composer">
          <button type="button" id="mic" title="Tap to talk, tap again to send">🎤</button>
          <input id="chat-input" placeholder="Or type: “Remind me tomorrow at 9 to call the vet”" autocomplete="off">
          <button class="primary" id="send">Send</button>
        </form>
      </section>
    </main>
  </div>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
